# ---------- Theme (catppuccin) ----------
set -g status-position bottom
set -g @catppuccin_flavor 'macchiato'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ---------- Status bar (uses catppuccin theme colours; must stay below the run line) ----------
set -g status on

set -gF status-style "bg=#{@thm_crust},fg=#{@thm_fg}"
set -g status-left-length 20
set -g status-right-length 100

# Left: red PREFIX badge while prefix is active, yellow COPY badge in copy mode
set -g status-left "#{?client_prefix,#[bg=#{@thm_red}]#[fg=#{@thm_crust}]#[bold] PREFIX #[default] ,#{?pane_in_mode,#[bg=#{@thm_yellow}]#[fg=#{@thm_crust}]#[bold] COPY #[default] ,}}"

# Right: host and session (session turns red while prefix is active)
set -g status-right "#[fg=#{@thm_overlay_0}]host #[fg=#{@thm_teal}]#h   #[fg=#{@thm_overlay_0}]session #{?client_prefix,#[fg=#{@thm_red}],#[fg=#{@thm_mauve}]}#[bold]#S "

# Window list
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W#{?window_zoomed_flag, (Z),} "
set -gF window-status-style "fg=#{@thm_overlay_0}"
set -gF window-status-current-style "fg=#{@thm_fg},bold"

# Dim inactive panes
set -gF window-style "fg=#{@thm_overlay_2}"
set -gF window-active-style "fg=#{@thm_fg}"

# Name unnamed windows after their folder
set -g automatic-rename-format "#{b:pane_current_path}"

# Ghostty window title
set -g set-titles on
set -g set-titles-string "#h · #S · #W"

# ---------- Options ----------
set -g default-terminal "tmux-256color"   # use "screen-256color" if the cluster complains
set -sg terminal-overrides ",*:RGB"       # true color support
set -g escape-time 10                     # small delay so Alt/Cmd sequences parse reliably
set -g mouse on
set -g renumber-windows on                # keep window numbers sequential
set -g repeat-time 1000                   # time window for repeatable keys (e.g. resize)
set -g base-index 1
set -g pane-base-index 1

# From sergios config
set -g history-limit 10000                # more scrollback
set -g mode-keys vi                       # vim keys in copy mode (prefix [ , v to select, y to copy)
set -g set-clipboard on                   # copy from cluster tmux into your Mac clipboard
set -g detach-on-destroy off              # closing a session switches to another instead of detaching
set -g focus-events on                    # lets vim/nvim notice focus changes
set -g monitor-activity off               # no highlighting of windows with activity
set -g bell-action none                   # no bells/flashes

# ---------- Prefix ----------
unbind C-b
set -g prefix `
bind ` send-prefix

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display-message "Reloaded the config"

# ---------- Prefix bindings ----------
# Panes (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Arrows (no repeat)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Splits (open in current directory)
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Sessions
bind S choose-tree -sZ                                                # ` S -> session picker
bind N command-prompt -p "New session:" "new-session -s '%%'"         # ` N -> new named session

# Other
bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z

# ---------- Prefix-free bindings (sent from Ghostty via Cmd) ----------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-x confirm-before -p "Kill pane? (y/n)" kill-pane
bind -n M-X confirm-before -p "Kill window? (y/n)" kill-window
bind -n M-z resize-pane -Z
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-p previous-window
bind -n M-n next-window

bind -n M-r command-prompt -p "Rename window:" "rename-window '%%'"
bind -n M-R command-prompt -p "Rename session:" "rename-session '%%'"

bind -n M-S choose-tree -sZ                                           # Cmd+Shift+S -> session picker
bind -n M-N command-prompt -p "New session:" "new-session -s '%%'"    # Cmd+Shift+N -> new session

bind -n 'M-{' swap-window -t -1 \; select-window -t -1
bind -n 'M-}' swap-window -t +1 \; select-window -t +1