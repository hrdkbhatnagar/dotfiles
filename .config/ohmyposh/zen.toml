console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[secondary_prompt]
  template = '❯❯ '
  foreground = 'magenta'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

# ---------- Line 1 (left): user@host  path  git ----------
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'session'
    style = 'plain'
    background = 'transparent'
    foreground = 'green'
    template = '{{ if .SSHSession }}{{ .UserName }}@{{ .HostName }} {{ end }}'  # only shown over SSH

  [[blocks.segments]]
    template = '{{ .Path }}'
    foreground = 'blue'
    background = 'transparent'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'agnoster_short'
      max_depth = 3

  [[blocks.segments]]
    template = ' git:<b>({{ .HEAD }})</b>{{ if .Working.Changed }}<yellow> *</>{{ end }}{{ if .Staging.Changed }}<green> *</>{{ end }}{{ if gt .Behind 0 }}<red> ↓{{ .Behind }}</>{{ end }}{{ if gt .Ahead 0 }}<green> ↑{{ .Ahead }}</>{{ end }}'
    foreground = 'white'
    background = 'transparent'
    type = 'git'
    style = 'plain'

    [blocks.segments.properties]
      branch_icon = ''
      cache_duration = 'none'
      commit_icon = '@'
      fetch_status = true

# ---------- Line 1 (right): python env  execution time ----------
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    foreground = 'yellow'
    background = 'transparent'
    template = '{{ if .Venv }}(<b>{{ .Venv }}</b>) {{ end }}'

    [blocks.segments.properties]
      fetch_version = false

  [[blocks.segments]]
    template = '{{ .FormattedMs }}'
    foreground = 'yellow'
    background = 'transparent'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 5000

# ---------- Line 2: ❯ (magenta, red after a failed command) ----------
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '❯'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'