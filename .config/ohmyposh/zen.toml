console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

# ---------- Colours: catppuccin macchiato ----------
# Use these anywhere as p:<name>, e.g. foreground = 'p:blue' or <p:yellow>text</>.
# To switch flavour, replace this block with another catppuccin palette.
[palette]
  rosewater = '#f4dbd6'
  flamingo  = '#f0c6c6'
  pink      = '#f5bde6'
  mauve     = '#c6a0f6'
  red       = '#ed8796'
  maroon    = '#ee99a0'
  peach     = '#f5a97f'
  yellow    = '#eed49f'
  green     = '#a6da95'
  teal      = '#8bd5ca'
  sky       = '#91d7e3'
  sapphire  = '#7dc4e4'
  blue      = '#8aadf4'
  lavender  = '#b7bdf8'
  text      = '#cad3f5'
  subtext1  = '#b8c0e0'
  subtext0  = '#a5adcb'
  overlay2  = '#939ab7'
  overlay1  = '#8087a2'
  overlay0  = '#6e738d'

[secondary_prompt]
  template = '❯❯ '
  foreground = 'p:pink'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:pink{{end}}']

# ---------- Line 1 (left): (venv) user@host path on branch ----------
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  # Python virtualenv / conda env, only when one is active
  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    foreground = 'p:yellow'
    background = 'transparent'
    template = '{{ if .Venv }}({{ .Venv }}) {{ end }}'

    [blocks.segments.properties]
      fetch_version = false

  # user@host, only over SSH. Green on login nodes, sky everywhere else (e.g. compute nodes)
  [[blocks.segments]]
    type = 'session'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:sky'
    foreground_templates = ['{{ if hasPrefix "login" .HostName }}p:green{{ end }}']
    template = '{{ if .SSHSession }}{{ .UserName }}@{{ .HostName }} {{ end }}'

  # Current folder, shortened to the last 3 levels
  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    foreground = 'p:blue'
    background = 'transparent'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'agnoster_short'
      max_depth = 3

  # Git: "on main*+ ↓1 ↑2"  (* unstaged, + staged, ↓ behind, ↑ ahead)
  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = 'p:subtext0'
    background = 'transparent'
    template = ' <p:overlay0>on</> <b>{{ .HEAD }}</b>{{ if .Working.Changed }}<p:yellow>*</>{{ end }}{{ if .Staging.Changed }}<p:green>+</>{{ end }}{{ if gt .Behind 0 }}<p:red> ↓{{ .Behind }}</>{{ end }}{{ if gt .Ahead 0 }}<p:teal> ↑{{ .Ahead }}</>{{ end }}'

    [blocks.segments.properties]
      branch_icon = ''
      cache_duration = 'none'
      commit_icon = '@'
      fetch_status = true

# ---------- Line 1 (right): duration of the last command, if it took over 5s ----------
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = 'p:yellow'
    background = 'transparent'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 5000
      style = 'round'

# ---------- Line 2: ❯ (pink, red after a failed command) ----------
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    background = 'transparent'
    template = '❯'
    foreground_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:pink{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'